<style>
  :root{
    --bg:#0d0f14;--bg-2:#11141b;--surface:#161a23;--surface-2:#1b202b;--surface-hi:#202635;
    --border:#272d3a;--border-hi:#343c4d;
    --ink:#ECEAE3;--ink-2:#aab1c0;--ink-3:#6a7280;
    --gold:#EBA940;--gold-soft:#f3c373;--gold-rgb:235,169,64;--gold-glow:rgba(var(--gold-rgb),.16);
    --teal:#4FC4BC;--coral:#E08A5B;--violet:#A593E0;--green:#7DBE7D;--blue:#6FA8E0;--rose:#E07A9B;
    --fav-bg-1:#33291a;--fav-bg-2:#241c12;--fav-border:rgba(var(--gold-rgb),.6);
    --radius:15px;--maxw:600px;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --sans:'IBM Plex Sans KR','IBM Plex Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;

      linear-gradient(180deg,#10131a 0%, var(--bg) 38%, #0a0c11 100%);}

  .wrap{max-width:var(--maxw);margin:0 auto;padding:0 16px 84px;}
  header{padding:28px 2px 8px;}
  .kicker{font-family:var(--mono);font-size:11px;font-weight:500;letter-spacing:.2em;text-transform:uppercase;
    color:var(--gold);display:flex;align-items:center;gap:9px;}
  .lamp{width:9px;height:9px;border-radius:50%;background:var(--gold);animation:pulse 3.4s ease-in-out infinite;flex:none;}
  @keyframes pulse{0%,100%{box-shadow:0 0 12px 1px rgba(var(--gold-rgb),.5);opacity:1}50%{box-shadow:0 0 22px 6px rgba(var(--gold-rgb),.18);opacity:.78}}
  h1{font-size:30px;line-height:1.15;font-weight:700;margin:13px 0 0;letter-spacing:-.025em;}
  h1 em{font-style:normal;color:var(--gold-soft);}
  .date{font-family:var(--mono);font-size:12px;color:var(--ink-3);margin-top:9px;letter-spacing:.03em;}
  .oneline{margin-top:16px;background:linear-gradient(180deg,rgba(var(--gold-rgb),.1),rgba(var(--gold-rgb),.03));
    border:1px solid rgba(var(--gold-rgb),.28);border-radius:13px;padding:13px 15px;font-size:14px;color:var(--ink);line-height:1.6;}
  .oneline > b{color:var(--gold-soft);font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;display:block;margin-bottom:6px;}
  .oneline #oneline-text b{color:var(--gold-soft);font-weight:700;}
  .ctrl{position:sticky;top:0;z-index:30;margin:18px -16px 0;padding:11px 16px;display:flex;align-items:center;gap:8px;
    background:rgba(13,15,20,.85);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--border);}
  .btn{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:12px;font-weight:500;cursor:pointer;
    color:var(--ink-2);background:var(--surface);border:1px solid var(--border);padding:8px 12px;border-radius:10px;transition:.16s;white-space:nowrap;}
  .btn:active{transform:scale(.95);}.btn .i{font-size:13px;line-height:1;}
  .favbtn{margin-left:auto;}
  .favbtn .fstar{font-size:13px;color:var(--ink-3);}
  .favbtn .fnum{font-size:11px;min-width:17px;height:17px;padding:0 5px;border-radius:9px;background:var(--surface-hi);color:var(--ink-2);display:inline-flex;align-items:center;justify-content:center;}
  .favbtn.active{background:rgba(var(--gold-rgb),.14);border-color:var(--fav-border);color:var(--gold-soft);}
  .favbtn.active .fstar{color:var(--gold);}.favbtn.active .fnum{background:rgba(var(--gold-rgb),.22);color:var(--gold-soft);}
  .section{margin-top:24px;}.section.hide{display:none;}
  .sec-head{display:flex;align-items:center;gap:9px;margin:0 2px 11px;}
  .sec-head .ic{font-size:15px;}.sec-head .nm{font-size:14px;font-weight:700;letter-spacing:-.01em;}
  .sec-head .ln{flex:1;height:1px;background:var(--border);}

  .tag-you{font-family:var(--mono);font-size:9px;font-weight:700;color:var(--gold);border:1px solid rgba(var(--gold-rgb),.45);
    border-radius:5px;padding:2px 6px;letter-spacing:.04em;}
  .card{background:linear-gradient(180deg,var(--surface) 0%,var(--bg-2) 100%);border:1px solid var(--border);
    border-radius:var(--radius);margin-bottom:8px;overflow:hidden;opacity:0;transform:translateY(7px);
    animation:rise .45s cubic-bezier(.2,.7,.3,1) forwards;transition:background .25s, border-color .25s;}
  @keyframes rise{to{opacity:1;transform:none}}
  .card.open{border-color:var(--border-hi);}
  .card.fav{border-color:var(--fav-border);}
  .card.hide{display:none;}
  .head{display:flex;align-items:flex-start;gap:11px;padding:14px 14px;cursor:pointer;user-select:none;}
  .accent{width:3px;align-self:stretch;border-radius:3px;flex:none;background:var(--ink-3);min-height:20px;}
  .c-model .accent{background:var(--teal);}.c-dev .accent{background:var(--violet);}
  .c-research .accent{background:var(--blue);}.c-policy .accent{background:var(--coral);}
  .c-money .accent{background:var(--green);}.c-korea .accent{background:var(--rose);}
  .htext{flex:1;min-width:0;}
  .htitle{font-size:15.5px;font-weight:600;line-height:1.42;}
  .hmeta{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-top:4px;display:flex;align-items:center;gap:7px;flex-wrap:wrap;}
  .hmeta .warn{color:var(--gold);}
  .when{color:var(--ink-3);}
  a.srclink{color:var(--teal);text-decoration:none;border-bottom:1px dotted rgba(79,196,188,.5);}

  .card.open .chev{transform:rotate(180deg);color:var(--gold);}

  .hook{display:block;font-size:12px;color:var(--ink-2);margin-top:5px;line-height:1.4;}
  .hook b{color:var(--gold-soft);font-weight:600;}
  .why{margin-bottom:10px;background:rgba(var(--gold-rgb),.14);border:1px solid rgba(var(--gold-rgb),.3);
    border-radius:10px;padding:9px 12px;font-size:13px;color:var(--ink);line-height:1.58;
    display:flex;gap:0.45em;align-items:flex-start;}
  .why b{color:#fff;font-weight:700;}
  .warn-badge{font-size:10px;font-weight:700;color:var(--gold);background:rgba(var(--gold-rgb),.15);
    border:1px solid rgba(var(--gold-rgb),.4);border-radius:4px;padding:1px 5px;margin-left:6px;
    letter-spacing:.02em;vertical-align:middle;}
  .srcline{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-top:11px;}
  .quiz{display:none;margin-top:6px;background:rgba(79,196,188,.07);border:1px solid rgba(79,196,188,.28);border-radius:11px;padding:12px;}
  .card.flip .detail{display:none;}
  .card.flip .quiz{display:block;}

  .quiz-go:active{transform:scale(.97);}
  .quiz-back{font-family:var(--mono);font-size:11px;color:var(--ink-3);background:none;border:0;cursor:pointer;padding:0;margin-bottom:10px;display:block;}
  .quiz-q{font-size:13px;font-weight:600;color:var(--ink);line-height:1.5;margin-bottom:9px;}
  .quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
  .quiz-opt{text-align:left;font-family:var(--sans);font-size:12.5px;line-height:1.4;color:var(--ink-2);background:var(--surface);border:1px solid var(--border);border-radius:9px;padding:9px 11px;cursor:pointer;transition:.14s;}
  .quiz-opt:active{transform:scale(.97);}
  .quiz-opt.correct{background:rgba(125,190,125,.18);border-color:var(--green);color:#cdeccd;}
  .quiz-opt.wrong{background:rgba(224,122,155,.16);border-color:var(--rose);color:#f0c3d2;}
  .quiz-opt:disabled{cursor:default;}
  .quiz-fb{font-size:12px;margin-top:9px;min-height:15px;font-weight:600;}
  .quiz-fb.ok{color:var(--green);}.quiz-fb.no{color:var(--rose);}
  footer{margin-top:30px;padding:16px 4px 0;border-top:1px solid var(--border);}
  footer p{font-size:11px;color:var(--ink-3);line-height:1.7;margin:0;}

  .empty{display:none;text-align:center;padding:48px 20px;color:var(--ink-3);}
  .empty.show{display:block;}.empty .es{font-size:38px;display:block;margin-bottom:12px;opacity:.5;}
  .empty p{font-size:14px;margin:0;}.empty b{color:var(--gold-soft);}

  const ITEMS = {};  // id -> 항목 데이터(중계로 전송/주간 모아보기용)

  const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const TZ = {PT:'미국 서부',PST:'미국 서부',PDT:'미국 서부',ET:'미국 동부',EST:'미국 동부',EDT:'미국 동부',MT:'미국 산악',MST:'미국 산악',MDT:'미국 산악',CT:'미국 중부',CST:'중국',UTC:'세계표준',GMT:'세계표준',CET:'유럽 중부',CEST:'유럽 중부',BST:'영국',JST:'일본',KST:'한국',IST:'인도'};
  const fmtDate = s => esc(s).replace(/\(([A-Z]{2,5})\)/g, (_,tz) => TZ[tz]?`(${TZ[tz]})`:`(${tz})`);
  // allow simple <b> emphasis authored in bullets: we escape, then un-escape <b>/</b>
  const rich = s => esc(s).replace(/&lt;b&gt;/g,"<b>").replace(/&lt;\/b&gt;/g,"</b>");

  document.getElementById("date-line").textContent = DIGEST.date_line || "";
  document.getElementById("oneline-text").innerHTML = rich(DIGEST.oneline || "");
  if (DIGEST.kicker) document.getElementById("kicker-text").textContent = DIGEST.kicker;
  if (DIGEST.footer_tag) document.getElementById("foot-tg").textContent = DIGEST.footer_tag;

  const list = document.getElementById("list");
  (DIGEST.sections || []).forEach(sec => {
    const s = document.createElement("section");
    s.className = "section";
    const youTag = sec.you ? `<span class="tag-you">PICK</span>` : "";
    s.innerHTML = `<div class="sec-head"><span class="ic">${esc(sec.icon||"")}</span><span class="nm">${esc(sec.name||"")}</span>${youTag}<span class="ln"></span><span class="ct">${(sec.items||[]).length}</span></div>`;
    (sec.items || []).forEach(it => {
      ITEMS[it.id] = Object.assign({}, it, { _icon: sec.icon, _section: sec.name });
      const cat = "c-" + (it.cat || "model");
      const warnBadge = it.warn ? ` <span class="warn-badge">⚠ 주의</span>` : "";
      const bullets = (it.bullets || []).map(b => `<li>${rich(b)}</li>`).join("");
      const why = it.why ? `<div class="why"><span style="flex:none">💡</span><span>${rich(it.why)}</span></div>` : "";
      const you = it.you ? `<div class="youline">${rich(it.you)}</div>` : "";
      const hasQuiz = it.quiz && Array.isArray(it.quiz.opts) && it.quiz.opts.length === 4;
      const quizBtn = hasQuiz ? `<button class="quiz-go">🧠 퀴즈 풀기</button>` : "";
      const quiz = hasQuiz ? `
          <div class="quiz" data-ans="${it.quiz.ans}">
            <button class="quiz-back">← 돌아가기</button>
            <div class="quiz-q">🧠 ${rich(it.quiz.q||"")}</div>
            <div class="quiz-opts">${it.quiz.opts.map((o,i)=>`<button class="quiz-opt" data-i="${i}">${esc(o)}</button>`).join("")}</div>
            <div class="quiz-fb"></div>
          </div>` : "";
      const card = document.createElement("article");
      card.className = "card " + cat;
      card.dataset.id = it.id;
      card.innerHTML = `
        <div class="head"><span class="accent"></span><span class="htext">
          <span class="htitle">${rich(it.title||"")}${warnBadge}</span>
          ${it.meta?`<span class="hook">${rich(it.meta)}</span>`:""}
          ${it.date_local?`<span class="hmeta"><span class="when">${fmtDate(it.date_local)}${it.date_kst?" · "+esc(it.date_kst):""}</span></span>`:""}
        </span><button class="star">☆</button><span class="chev">▼</span></div>
        <div class="body"><div class="body-in"><div class="body-pad">
          <div class="detail">
          ${why}<ul class="blt">${bullets}</ul>${you}
          <div class="srcline">${it.url?`<a class="srclink" href="${esc(it.url)}" target="_blank" rel="noopener">출처 ▸ ${esc(it.source||"")} ↗</a>`:`출처 ▸ ${esc(it.source||"")}`}</div>
          <div class="memo-wrap" style="margin-top:11px;">
            <textarea class="memo-in" data-id="${it.id}" rows="2" placeholder="📝 메모…" style="width:100%;box-sizing:border-box;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:8px;color:inherit;font:inherit;font-size:13px;line-height:1.5;padding:7px 9px;resize:vertical;"></textarea>
            <div style="display:flex;align-items:center;gap:9px;margin-top:6px;">
              <button class="memo-save" data-id="${it.id}" title="메모 저장" style="flex:none;border:1px solid rgba(var(--gold-rgb),.45);background:rgba(var(--gold-rgb),.13);border-radius:11px;padding:5px 13px;font-size:15px;line-height:1;cursor:pointer;">💾</button>
              <span class="memo-status" style="font-size:11px;opacity:.65;"></span>
            </div>
          </div>
          ${quizBtn}
          </div>
          ${quiz}
        </div></div></div>`;
      s.appendChild(card);
    });
    list.appendChild(s);
  });

  // ===== favorites + interactions =====
  const KEY = "ai_daily_favs_v1";
  let favs = new Set();
  try { const r = localStorage.getItem(KEY); if (r) favs = new Set(JSON.parse(r)); } catch(e){}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...favs])); } catch(e){} };
  let favOnly = false;

  // 즐겨찾기 쓰기 암호 — 이 기기에 한 번만 입력받아 localStorage 보관(소스엔 없음)
  function favSecret(){ let s=""; try{ s=localStorage.getItem("ai_daily_fav_secret")||""; }catch(e){} if(!s){ s=(window.prompt("즐겨찾기 암호 (이 기기에 한 번만 입력)")||"").trim(); if(s){ try{localStorage.setItem("ai_daily_fav_secret",s);}catch(e){} } } return s; }
  // 중계(Worker)로 별표 상태 기록 — 암호 동봉. 401(암호틀림)이면 저장암호 비우고 안내
  async function recordFav(id, on){
    if(!FAV_API) return;
    try{
      const r = await fetch(FAV_API, { method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ id, fav:on, date: DIGEST.date, slot: DIGEST.slot, item: ITEMS[id] || null, secret: favSecret() }) });
      if(r.status===401){ try{localStorage.removeItem("ai_daily_fav_secret");}catch(e){} alert("즐겨찾기 암호가 틀렸습니다. 다시 ★를 눌러 입력하세요."); }
    }catch(e){ /* 네트워크 실패 무시 */ }
  }
  // 다른 기기에서 누른 별표 동기화 — 배포 시에만
  async function syncFav(){
    if(!FAV_API) return;
    try{
      const r = await fetch(FAV_API, { method:"GET" });
      if(!r.ok) return;
      const data = await r.json();           // { id: record, ... }
      Object.keys(data||{}).forEach(id => {
        favs.add(id);
        const rec = data[id];
        if (rec && rec.memo) { const t = document.querySelector('.memo-in[data-id="'+id+'"]'); if (t) t.value = rec.memo; }
      });
      save();
      document.querySelectorAll(".card").forEach(c => {
        if(favs.has(c.dataset.id)){ const st=c.querySelector(".star"); st.classList.add("on"); st.textContent="★"; c.classList.add("fav"); }
      });
      document.getElementById("fnum").textContent = favs.size;
    }catch(e){}
  }

  document.querySelectorAll(".card").forEach((c,i) => {
    const st = c.querySelector(".star");
    if (favs.has(c.dataset.id)) { st.classList.add("on"); st.textContent="★"; c.classList.add("fav"); }
    c.style.animationDelay = Math.min(i*32, 500) + "ms";
  });
  document.querySelectorAll(".head").forEach(h => {
    h.addEventListener("click", e => { if (e.target.closest(".star")) return; h.closest(".card").classList.toggle("open"); });
  });
  document.querySelectorAll(".star").forEach(st => {
    st.addEventListener("click", e => {
      e.stopPropagation();
      const c = st.closest(".card"), id = c.dataset.id;
      if (favs.has(id)) { favs.delete(id); st.classList.remove("on"); st.textContent="☆"; c.classList.remove("fav"); }
      else { favs.add(id); st.classList.add("on"); st.textContent="★"; c.classList.add("fav"); }
      save(); document.getElementById("fnum").textContent = favs.size;
      recordFav(id, favs.has(id));
      if (favOnly) applyFav();
    });
  });
  // 카드별 메모 — 💾 버튼을 눌러야 저장(의식적 저장). 저장 시 ★ 자동
  document.querySelectorAll(".memo-in").forEach(t => {
    t.addEventListener("click", e => e.stopPropagation());
    t.addEventListener("keydown", e => e.stopPropagation());
  });
  document.querySelectorAll(".memo-save").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      const id = btn.dataset.id;
      const wrap = btn.closest(".memo-wrap");
      const t = wrap.querySelector(".memo-in"), st = wrap.querySelector(".memo-status");
      const memo = t.value;
      if (!FAV_API) { st.textContent = "메모는 온라인 연결 시에만 저장됩니다"; return; }
      st.textContent = "저장 중…";
      try {
        const r = await fetch(FAV_API, { method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({ id, fav:true, memo, date:DIGEST.date, slot:DIGEST.slot, item: ITEMS[id]||null, secret: favSecret() }) });
        if (r.status === 401) { try{localStorage.removeItem("ai_daily_fav_secret");}catch(e){} st.textContent = "암호 필요 — 다시 누르세요"; return; }
        if (!r.ok) { st.textContent = "저장 실패"; return; }
        st.textContent = "저장됨 ✓";
        const c = btn.closest(".card"), star = c.querySelector(".star");
        favs.add(id); if(star){ star.classList.add("on"); star.textContent="★"; } c.classList.add("fav");
        save(); document.getElementById("fnum").textContent = favs.size;
      } catch(e) { st.textContent = "저장 실패(네트워크)"; }
    });
  });
  // 퀴즈 — "풀기" 버튼 누르면 본문 숨고 퀴즈 표시(flip), "돌아가기"로 복귀
  document.querySelectorAll(".quiz-go").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation(); b.closest(".card").classList.add("flip");
  }));
  document.querySelectorAll(".quiz-back").forEach(b => b.addEventListener("click", e => {
    e.stopPropagation();
    const c = b.closest(".card"); c.classList.remove("flip");
    const qz = c.querySelector(".quiz");
    qz.querySelectorAll(".quiz-opt").forEach(o => { o.disabled = false; o.classList.remove("correct", "wrong"); });
    const fb = qz.querySelector(".quiz-fb"); if (fb) { fb.textContent = ""; fb.className = "quiz-fb"; }
  }));
  // 퀴즈 — 보기 클릭 시 정답(초록)/오답(빨강) 표시, 한 번만 채점
  document.querySelectorAll(".quiz").forEach(qz => {
    const ans = parseInt(qz.dataset.ans, 10);
    const fb = qz.querySelector(".quiz-fb");
    qz.querySelectorAll(".quiz-opt").forEach(btn => {
      btn.addEventListener("click", e => {
        e.stopPropagation();
        const i = parseInt(btn.dataset.i, 10);
        qz.querySelectorAll(".quiz-opt").forEach((b, j) => { b.disabled = true; if (j === ans) b.classList.add("correct"); });
        if (i === ans) { fb.textContent = "정답! ✓"; fb.className = "quiz-fb ok"; }
        else { btn.classList.add("wrong"); fb.textContent = "오답 — 정답은 초록색"; fb.className = "quiz-fb no"; }
      });
    });
  });
  document.getElementById("openAll").addEventListener("click", () =>
    document.querySelectorAll(".card:not(.hide)").forEach(c => c.classList.add("open")));
  document.getElementById("closeAll").addEventListener("click", () =>
    document.querySelectorAll(".card").forEach(c => c.classList.remove("open")));
  function applyFav(){
    let vis=0;
    document.querySelectorAll(".card").forEach(c => { const show=!favOnly||favs.has(c.dataset.id); c.classList.toggle("hide",!show); if(show)vis++; });
    document.querySelectorAll(".section").forEach(s => { const n=s.querySelectorAll(".card:not(.hide)").length; s.classList.toggle("hide",n===0); });
    const e=document.getElementById("empty");
    if(vis===0){ e.classList.add("show"); document.getElementById("emptymsg").innerHTML=`아직 ★ 표시한 항목이 없어요.<br>카드의 <b>☆</b>를 눌러 모아보세요.`; }
    else e.classList.remove("show");
  }
  document.getElementById("favbtn").addEventListener("click", () => {
    favOnly=!favOnly; document.getElementById("favbtn").classList.toggle("active",favOnly); applyFav();
  });
  document.getElementById("fnum").textContent = favs.size;
  syncFav();
</script>
</body>
</html>
