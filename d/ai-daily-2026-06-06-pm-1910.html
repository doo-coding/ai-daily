  const DIGEST = JSON.parse(new TextDecoder().decode(Uint8Array.from(atob(__B64__), c=>c.charCodeAt(0))));
  // 즐겨찾기 중계(Cloudflare Worker) 주소. 배포 전이면 빈 문자열 → localStorage만 사용(오프라인 호환)
  const FAV_API = "https://ai-daily-fav.rechdo.workers.dev";
  const ITEMS = {};  // id -> 항목 데이터(중계로 전송/주간 모아보기용)

  const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  // allow simple <b> emphasis authored in bullets: we escape, then un-escape <b>/</b>
  const rich = s => esc(s).replace(/&lt;b&gt;/g,"<b>").replace(/&lt;\/b&gt;/g,"</b>");

  document.getElementById("date-line").textContent = DIGEST.date_line || "";
  document.getElementById("oneline-text").innerHTML = rich(DIGEST.oneline || "");
  if (DIGEST.kicker) document.getElementById("kicker-text").textContent = DIGEST.kicker;
  if (DIGEST.footer_tag) document.getElementById("foot-tg").textContent = DIGEST.footer_tag;

  const list = document.getElementById("list");
  (DIGEST.sections || []).forEach(sec => {
    const s = document.createElement("section");
    s.className = "section";
    const youTag = sec.you ? `<span class="tag-you">PICK</span>` : "";
    s.innerHTML = `<div class="sec-head"><span class="ic">${esc(sec.icon||"")}</span><span class="nm">${esc(sec.name||"")}</span>${youTag}<span class="ln"></span><span class="ct">${(sec.items||[]).length}</span></div>`;
    (sec.items || []).forEach(it => {
      ITEMS[it.id] = Object.assign({}, it, { _icon: sec.icon, _section: sec.name });
      const cat = "c-" + (it.cat || "model");
      const warnCls = it.warn ? ' class="warn"' : "";
      const bullets = (it.bullets || []).map(b => `<li>${rich(b)}</li>`).join("");
      const you = it.you ? `<div class="youline">${rich(it.you)}</div>` : "";
      const card = document.createElement("article");
      card.className = "card " + cat;
      card.dataset.id = it.id;
      card.innerHTML = `
        <div class="head"><span class="accent"></span><span class="htext">
          <span class="htitle">${rich(it.title||"")}</span>
          <span class="hmeta"><span${warnCls}>${esc(it.meta||"")}</span>${it.date_local?`<span class="when">${esc(it.date_local)}${it.date_kst?" · "+esc(it.date_kst):""}</span>`:""}</span>
        </span><button class="star">☆</button><span class="chev">▼</span></div>
        <div class="body"><div class="body-in"><div class="body-pad">
          <ul class="blt">${bullets}</ul>${you}
          <div class="srcline">${it.url?`<a class="srclink" href="${esc(it.url)}" target="_blank" rel="noopener">출처 ▸ ${esc(it.source||"")} ↗</a>`:`출처 ▸ ${esc(it.source||"")}`}</div>
          <div class="memo-wrap" style="margin-top:11px;">
            <textarea class="memo-in" data-id="${it.id}" rows="2" placeholder="📝 메모…" style="width:100%;box-sizing:border-box;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.14);border-radius:8px;color:inherit;font:inherit;font-size:13px;line-height:1.5;padding:7px 9px;resize:vertical;"></textarea>
            <div style="display:flex;align-items:center;gap:9px;margin-top:6px;">
              <button class="memo-save" data-id="${it.id}" title="메모 저장" style="flex:none;border:1px solid rgba(235,169,64,.45);background:rgba(235,169,64,.13);border-radius:11px;padding:5px 13px;font-size:15px;line-height:1;cursor:pointer;">💾</button>
              <span class="memo-status" style="font-size:11px;opacity:.65;"></span>
            </div>
          </div>
        </div></div></div>`;
      s.appendChild(card);
    });
    list.appendChild(s);
  });

  // ===== favorites + interactions =====
  const KEY = "ai_daily_favs_v1";
  let favs = new Set();
  try { const r = localStorage.getItem(KEY); if (r) favs = new Set(JSON.parse(r)); } catch(e){}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify([...favs])); } catch(e){} };
  let favOnly = false;

  // 즐겨찾기 쓰기 암호 — 이 기기에 한 번만 입력받아 localStorage 보관(소스엔 없음)
  function favSecret(){ let s=""; try{ s=localStorage.getItem("ai_daily_fav_secret")||""; }catch(e){} if(!s){ s=(window.prompt("즐겨찾기 암호 (이 기기에 한 번만 입력)")||"").trim(); if(s){ try{localStorage.setItem("ai_daily_fav_secret",s);}catch(e){} } } return s; }
  // 중계(Worker)로 별표 상태 기록 — 암호 동봉. 401(암호틀림)이면 저장암호 비우고 안내
  async function recordFav(id, on){
    if(!FAV_API) return;
    try{
      const r = await fetch(FAV_API, { method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({ id, fav:on, date: DIGEST.date, slot: DIGEST.slot, item: ITEMS[id] || null, secret: favSecret() }) });
      if(r.status===401){ try{localStorage.removeItem("ai_daily_fav_secret");}catch(e){} alert("즐겨찾기 암호가 틀렸습니다. 다시 ★를 눌러 입력하세요."); }
    }catch(e){ /* 네트워크 실패 무시 */ }
  }
  // 다른 기기에서 누른 별표 동기화 — 배포 시에만
  async function syncFav(){
    if(!FAV_API) return;
    try{
      const r = await fetch(FAV_API, { method:"GET" });
      if(!r.ok) return;
      const data = await r.json();           // { id: record, ... }
      Object.keys(data||{}).forEach(id => {
        favs.add(id);
        const rec = data[id];
        if (rec && rec.memo) { const t = document.querySelector('.memo-in[data-id="'+id+'"]'); if (t) t.value = rec.memo; }
      });
      save();
      document.querySelectorAll(".card").forEach(c => {
        if(favs.has(c.dataset.id)){ const st=c.querySelector(".star"); st.classList.add("on"); st.textContent="★"; c.classList.add("fav"); }
      });
      document.getElementById("fnum").textContent = favs.size;
    }catch(e){}
  }

  document.querySelectorAll(".card").forEach((c,i) => {
    const st = c.querySelector(".star");
    if (favs.has(c.dataset.id)) { st.classList.add("on"); st.textContent="★"; c.classList.add("fav"); }
    c.style.animationDelay = Math.min(i*32, 500) + "ms";
  });
  document.querySelectorAll(".head").forEach(h => {
    h.addEventListener("click", e => { if (e.target.closest(".star")) return; h.closest(".card").classList.toggle("open"); });
  });
  document.querySelectorAll(".star").forEach(st => {
    st.addEventListener("click", e => {
      e.stopPropagation();
      const c = st.closest(".card"), id = c.dataset.id;
      if (favs.has(id)) { favs.delete(id); st.classList.remove("on"); st.textContent="☆"; c.classList.remove("fav"); }
      else { favs.add(id); st.classList.add("on"); st.textContent="★"; c.classList.add("fav"); }
      save(); document.getElementById("fnum").textContent = favs.size;
      recordFav(id, favs.has(id));
      if (favOnly) applyFav();
    });
  });
  // 카드별 메모 — 💾 버튼을 눌러야 저장(의식적 저장). 저장 시 ★ 자동
  document.querySelectorAll(".memo-in").forEach(t => {
    t.addEventListener("click", e => e.stopPropagation());
    t.addEventListener("keydown", e => e.stopPropagation());
  });
  document.querySelectorAll(".memo-save").forEach(btn => {
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      const id = btn.dataset.id;
      const wrap = btn.closest(".memo-wrap");
      const t = wrap.querySelector(".memo-in"), st = wrap.querySelector(".memo-status");
      const memo = t.value;
      if (!FAV_API) { st.textContent = "메모는 온라인 연결 시에만 저장됩니다"; return; }
      st.textContent = "저장 중…";
      try {
        const r = await fetch(FAV_API, { method:"POST", headers:{"Content-Type":"application/json"},
          body: JSON.stringify({ id, fav:true, memo, date:DIGEST.date, slot:DIGEST.slot, item: ITEMS[id]||null, secret: favSecret() }) });
        if (r.status === 401) { try{localStorage.removeItem("ai_daily_fav_secret");}catch(e){} st.textContent = "암호 필요 — 다시 누르세요"; return; }
        if (!r.ok) { st.textContent = "저장 실패"; return; }
        st.textContent = "저장됨 ✓";
        const c = btn.closest(".card"), star = c.querySelector(".star");
        favs.add(id); if(star){ star.classList.add("on"); star.textContent="★"; } c.classList.add("fav");
        save(); document.getElementById("fnum").textContent = favs.size;
      } catch(e) { st.textContent = "저장 실패(네트워크)"; }
    });
  });
  document.getElementById("openAll").addEventListener("click", () =>
    document.querySelectorAll(".card:not(.hide)").forEach(c => c.classList.add("open")));
  document.getElementById("closeAll").addEventListener("click", () =>
    document.querySelectorAll(".card").forEach(c => c.classList.remove("open")));
  function applyFav(){
    let vis=0;
    document.querySelectorAll(".card").forEach(c => { const show=!favOnly||favs.has(c.dataset.id); c.classList.toggle("hide",!show); if(show)vis++; });
    document.querySelectorAll(".section").forEach(s => { const n=s.querySelectorAll(".card:not(.hide)").length; s.classList.toggle("hide",n===0); });
    const e=document.getElementById("empty");
    if(vis===0){ e.classList.add("show"); document.getElementById("emptymsg").innerHTML=`아직 ★ 표시한 항목이 없어요.<br>카드의 <b>☆</b>를 눌러 모아보세요.`; }
    else e.classList.remove("show");
  }
  document.getElementById("favbtn").addEventListener("click", () => {
    favOnly=!favOnly; document.getElementById("favbtn").classList.toggle("active",favOnly); applyFav();
  });
  document.getElementById("fnum").textContent = favs.size;
  syncFav();
</script>
</body>
